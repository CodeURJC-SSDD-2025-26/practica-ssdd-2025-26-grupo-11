<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro - BiblioOnline</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/css/header-footer.css" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <div class="brand-wrapper">
          <img src="/images/logo.png" class="header-logo" alt="Logo" />
          <a class="navbar-brand" href="/">BiblioOnline</a>
        </div>
      </div>
    </nav>

    <main class="container flex-grow-1 d-flex justify-content-center align-items-center py-5">
      <div class="col-12 col-md-10 col-lg-6">
        <div class="card auth-card shadow-lg border-0">
          <div class="card-body p-4 p-md-5">
            <h3 class="text-center mb-4">Crea tu perfil</h3>

            {{#errors}}
            <div class="alert alert-danger" role="alert">
              <ul class="mb-0">
                {{#errors}}<li>{{.}}</li>{{/errors}}
              </ul>
            </div>
            {{/errors}}

            <form method="post" action="/register">
              <input type="hidden" name="_csrf" value="{{token}}" />

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="name">Nombre</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-user"></i>
                    </span>
                    <input
                      id="name"
                      name="name"
                      type="text"
                      class="form-control"
                      placeholder="Introduce tu nombre"
                      value="{{name}}"
                      maxlength="22"
                      required
                    />
                  </div>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label" for="surname">Apellido</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-user"></i>
                    </span>
                    <input
                      id="surname"
                      name="surname"
                      type="text"
                      class="form-control"
                      placeholder="Introduce tu apellido"
                      value="{{surname}}"
                      maxlength="22"
                      required
                    />
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                  </span>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    class="form-control"
                    placeholder="Introduce tu email"
                    value="{{email}}"
                    maxlength="30"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    class="form-control"
                    placeholder="Introduce tu contraseña"
                    minlength="6"
                    maxlength="30"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirmar Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                  <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    class="form-control"
                    placeholder="Repite tu contraseña"
                    minlength="6"
                    maxlength="30"
                    required
                  />
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required />
                <label class="form-check-label" for="terms">
                  Acepto los términos y condiciones
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="fas fa-user-plus me-2"></i>
                Registrar
              </button>
            </form>

            <div class="text-center mt-4">
              ¿Ya tienes una cuenta?
              <a href="/login" class="text-decoration-none">Inicia sesión</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    {{>footer}}
  </body>
</html>
