<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modificar Préstamo - BiblioOnline</title>

  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/css/header-footer.css">
  <link rel="stylesheet" href="/css/base.css">
</head>

<body>

  {{>header}}

  <main class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-9">
        <div class="card shadow-sm border-2">
          <div class="card-header bg-custom-blue text-white p-3">
            <h5 class="mb-0">
              <i class="fas fa-pen-to-square me-2"></i>Modificar préstamo
            </h5>
          </div>

          <div class="card-body p-4">
            {{#errors}}
            <div class="alert alert-danger">
              <ul class="mb-0">
                {{#errors}}<li>{{.}}</li>{{/errors}}
              </ul>
            </div>
            {{/errors}}
            <form method="post" action="/admin/edit-loans/{{loan.id}}">
              <input type="hidden" name="_csrf" value="{{token}}">

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="loanId" class="form-label fw-bold">ID Préstamo</label>
                  <input type="text" class="form-control border-2" id="loanId" value="{{loan.id}}" readonly>
                </div>

                <div class="col-md-6 mb-3">
                  <label for="status" class="form-label fw-bold">Estado</label>
                  <select class="form-select border-2" id="status" name="status" required>
                    <option value="ACTIVO">ACTIVO</option>
                    <option value="VENCIDO">VENCIDO</option>
                    <option value="DEVUELTO">DEVUELTO</option>
                  </select>

                  <script>
                    document.getElementById('status').value = '{{loan.status}}';
                  </script>

                  <script>
                    document.getElementById('status').value = '{{loan.status}}';
                  </script>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Usuario (email)</label>
                  <input type="text" class="form-control border-2" value="{{loan.user.email}}" readonly>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Libro</label>
                  <input type="text" class="form-control border-2" value="{{loan.book.title}}" readonly>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Fecha préstamo</label>
                  <input type="date" class="form-control border-2" name="loanDate" value="{{loan.loanDate}}" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Fecha devolución</label>
                  <input type="date" class="form-control border-2" name="returnDate" value="{{loan.returnDate}}"
                    required>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a href="/admin/admin-panel#seccion-prestamos"
                  class="btn btn-outline-secondary fw-bold px-4">Cancelar</a>
                <button type="submit" class="btn btn-custom-blue fw-bold px-4">
                  <i class="fas fa-save me-2"></i>Guardar cambios
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  {{>footer}}
</body>

</html>
