<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BiblioOnline - Error interno del servidor</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/header-footer.css">
</head>
<body>
    {{>header}}

    <main class="container text-center py-5">
        <div class="py-5">
            <i class="fas fa-book-open fa-5x text-muted mb-4"></i>
            <h1 class="display-1 fw-bold text-muted">500</h1>
            <h2 class="mb-3">Error interno del servidor</h2>
            <p class="text-muted mb-4">Ha ocurrido un error inesperado. Por favor, inténtalo de nuevo más tarde.</p>
            <a href="/" class="btn btn-custom-blue px-4">
                <i class="fas fa-home me-2"></i>Volver al inicio
            </a>
        </div>
    </main>

    {{>footer}}
</body>
</html>
