<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BiblioOnline - Error de inicio de sesión</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header-footer.css">
</head>
<body>
    {{>header}}

    <main class="container text-center py-5">
        <div class="py-5">
            <i class="fas fa-user fa-5x text-muted mb-4"></i>
            <h1 class="mb-3">Error de inicio de sesión</h1>
            <h4 class="text-muted mb-4">Las credenciales ingresadas no son válidas. Por favor, inténtalo de nuevo.</h4>
            <a href="/login" class="btn btn-custom-blue px-4">
                <i class="fas fa-sign-in-alt me-2"></i>Intentar de nuevo
            </a>
        </div>
    </main>

    {{>footer}}
</body>
</html>
