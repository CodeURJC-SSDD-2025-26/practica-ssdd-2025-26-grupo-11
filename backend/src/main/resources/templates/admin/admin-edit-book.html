<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modificar Libro - BiblioOnline</title>

  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/css/header-footer.css">
  <link rel="stylesheet" href="/css/base.css">
</head>

<body>

  {{>header}}

  <main class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm border-2">
          <div class="card-header bg-custom-blue text-white p-3">
            <h5 class="mb-0"><i class="fas fa-pen-nib me-2"></i>Modificar libro</h5>
          </div>

          <div class="card-body p-4">
            <form method="post" action="/admin/admin-edit-book/{{book.id}}" enctype="multipart/form-data">
              <input type="hidden" name="_csrf" value="{{token}}">

              <div class="mb-4 text-center p-3 border rounded bg-light">
                {{#book.image}}
                <img src="/image/{{id}}" alt="Portada actual" class="img-fluid rounded mb-3"
                  style="max-height:180px;">
                {{/book.image}}

                <div class="mb-2 fw-bold">Cambiar portada</div>
                <input class="form-control w-75 mx-auto" type="file" id="imageField" name="imageField" accept="image/*">
              </div>

              <div class="mb-3">
                <label for="title" class="form-label fw-bold">Título del Libro</label>
                <input type="text" class="form-control border-2" id="title" name="title" value="{{book.title}}" maxlength="20" required>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="author" class="form-label fw-bold">Autor</label>
                  <input type="text" class="form-control border-2" id="author" name="author" value="{{book.author}}" maxlength="25" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label for="year" class="form-label fw-bold">Año de Publicación</label>
                  <input type="number" class="form-control border-2" id="year" name="year" value="{{book.year}}" required>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="genre" class="form-label fw-bold">Género / Categoría</label>
                  <select class="form-control border-2" id="genre" name="genre" required>
                    <option value="">-- Seleccionar género --</option>
                    <option value="FICCION">Ficción</option>
                    <option value="FANTASIA">Fantasía</option>
                    <option value="HISTORIA">Historia</option>
                    <option value="CIENCIA">Ciencia</option>
                    <option value="INFANTIL">Infantil</option>
                    <option value="MISTERIO">Misterio</option>
                    <option value="ROMANCE">Romance</option>
                    <option value="BIOGRAFIA">Biografía</option>
                    <option value="CLASICOS">Clásicos</option>
                  </select>
                  <script>
                    document.getElementById('genre').value = '{{currentGenre}}';
                  </script>
                </div>

                <div class="col-md-6 mb-3">
                  <label for="isbn" class="form-label fw-bold">ISBN</label>
                  <input type="number" class="form-control border-2" id="isbn" name="isbn" value="{{book.isbn}}" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="description" class="form-label fw-bold">Sinopsis / Descripción</label>
                <textarea class="form-control border-2" id="description" name="description" rows="4" maxlength="150">{{book.description}}</textarea>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a href="/admin/admin-panel" class="btn btn-outline-secondary fw-bold px-4">Cancelar</a>
                <button type="submit" class="btn btn-custom-blue fw-bold px-4">
                  <i class="fas fa-save me-2"></i>Guardar cambios
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  {{>footer}}
</body>

</html>
