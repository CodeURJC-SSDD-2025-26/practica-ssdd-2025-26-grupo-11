<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Editar Perfil - BiblioOnline</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/header-footer.css" />
</head>

<body>
    {{>header}}

    <main class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-2">
                    <div class="card-header bg-custom-blue p-3">
                        <h5 class="mb-0 text-white">Configuración del Perfil</h5>
                    </div>

                    <div class="card-body p-4">
                        <form method="post" action="/edit-profile" enctype="multipart/form-data">
                            <input type="hidden" name="_csrf" value="{{token}}" />

                            <div class="text-center mb-4">
                                <img src="/users/{{user.id}}/image" class="rounded-circle mb-3 border border-3" style="
                      width: 120px;
                      height: 120px;
                      object-fit: cover;
                      border-color: #5bc8e8 !important;
                    " alt="Foto de perfil" />

                                <div class="mb-3">
                                    <label for="profilePic" class="form-label fw-bold d-block">Cambiar foto de
                                        perfil</label>
                                    <input class="form-control border-2" type="file" id="profilePic" name="imageFile"
                                        accept="image/*" />
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold" for="name">Nombre</label>
                                    <div class="input-group">
                                        <span class="input-group-text border-2">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <input type="text" class="form-control border-2" id="name" name="name"
                                            value="{{user.name}}" required />
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold" for="surname">Apellido</label>
                                    <div class="input-group">
                                        <span class="input-group-text border-2">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <input type="text" class="form-control border-2" id="surname" name="surname"
                                            value="{{user.surname}}" required />
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold" for="email">Correo Electrónico</label>
                                <input type="email" class="form-control border-2" id="email" name="email"
                                    value="{{user.email}}" required />
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold" for="bio">Sobre mí:</label>
                                <textarea class="form-control border-2" id="bio" name="bio" rows="3">{{user.description}}</textarea>
                            </div>

                            <div class="d-flex gap-2 justify-content-end">
                                <a href="/profile" class="btn btn-outline-secondary px-4 fw-bold">Cancelar</a>
                                <button type="submit" class="btn btn-custom-blue px-4 fw-bold">
                                    Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    {{>footer}}
</body>

</html>
