<!-- templates/header.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BiblioOnline</title>
    <link rel="icon" type="image/png" href="/images/logo.png"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/header-footer.css">
    <link rel="stylesheet" href="/css/base.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <img src="/images/logo.png" class="header-logo" alt="Logo">
        <a class="navbar-brand" href="/">BiblioOnline</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/books">
                        <i class="fas fa-search search-icon"></i> Nuestros libros
                    </a>
                </li>

                {{#logged}}
                <li class="nav-item user-message">
                    <span>Hola, {{userName}}</span>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <img src="/users/{{userId}}/image" class="nav-avatar" alt="Foto de perfil"> Tu perfil
                    </a>
                    <ul class="dropdown-menu menu">
                        <li><a class="dropdown-item" href="/profile">
                            <i class="fa-solid fa-gear"></i> Mi cuenta</a></li>
                        <li><a class="dropdown-item" href="/my-loans">
                            <i class="fa-solid fa-book"></i> Mis préstamos</a></li>
                        <li><a class="dropdown-item" href="/logout">
                            <i class="fa-solid fa-sign-out"></i> Cerrar sesión</a></li>
                        {{#admin}}
                        <li><a class="dropdown-item" href="/admin">
                            <i class="fa-solid fa-user-shield"></i> Panel de administrador</a></li>
                        {{/admin}}
                    </ul>
                </li>
                {{/logged}}

                {{^logged}}
                <li class="nav-item">
                    <a class="nav-link" href="/register">
                        <i class="fas fa-user-plus"></i> Registrate</a></li>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">
                        <i class="fas fa-sign-in-alt"></i> Inicia sesión</a></li>
                </li>
                {{/logged}}
            </ul>
        </div>
    </div>
</nav>
