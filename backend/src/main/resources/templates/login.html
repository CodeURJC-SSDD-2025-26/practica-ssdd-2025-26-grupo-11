<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión - BiblioOnline</title>
    <!-- FavIcon -->
    <link rel="icon" type="image/png" href="images/logo.png" />

    <!-- Bootstrap -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/header-footer.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <div class="brand-wrapper">
          <img src="images/logo.png" class="header-logo" alt="Logo" />
          <a class="navbar-brand" href="/">BiblioOnline</a>
        </div>
      </div>
    </nav>

    <!-- Login -->
    <main
      class="container flex-grow-1 d-flex justify-content-center align-items-center py-5"
    >
      <div class="col-12 col-md-8 col-lg-4">
        <div class="card auth-card shadow-lg border-0">
          <div class="card-body p-4 p-md-5">
            <h3 class="text-center mb-4">Bienvenido de nuevo</h3>
            {{#success}}
            <div class="alert alert-success" role="alert">{{success}}</div>
            {{/success}}

            <form method="post" action="/login">
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                  </span>
                  <input
                    type="text"
                    class="form-control"
                    name="username"
                    id="email"
                    placeholder="Introduce tu email"
                    maxlength="30"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    id="password"
                    placeholder="Introduce tu contraseña"
                    maxlength="30"
                    required
                  />
                </div>
              </div>

              <!-- Submit button -->
              <button
                type="submit"
                class="btn btn-primary w-100 py-2 fw-semibold"
              >
                <i class="fas fa-sign-in-alt me-2"></i>
                Iniciar sesión
              </button>
              <input type="hidden" name="_csrf" value="{{token}}" />
            </form>

            <div class="text-center mt-4">
              ¿No tienes una cuenta?
              <a href="/register" class="text-decoration-none">Regístrate</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    {{> footer}}
  </body>
</html>
