services:

  db:
    image: mysql:8.0
    container_name: biblio-db
    restart: always
    environment:
      MYSQL_DATABASE: biblioonline
      MYSQL_ROOT_PASSWORD: password
    networks:
      - biblio-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  utility:
    image: alvarobravo/biblio-utility:latest
    container_name: biblio-utility
    environment:
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: biblioonlineconfirmacion@gmail.com
      SPRING_MAIL_PASSWORD: tu_password_aplicacion
      SERVER_PORT: 8080
    networks:
      - biblio-net
    ports:
      - "8080:8080"

  app:
    image: alvarobravo/biblio-app:latest
    container_name: biblio-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/biblioonline
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      UTILITY_SERVICE_URL: http://utility:8080
    networks:
      - biblio-net
    ports:
      - "8443:8443"

networks:
  biblio-net:
    driver: bridge